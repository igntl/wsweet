<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --dark: #121212; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .hero { text-align: center; padding: 50px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('chocolate-bg.jpg'); background-size: cover; }
        .logo-img { width: 150px; border-radius: 50%; border: 3px solid var(--gold); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { border: 1px solid var(--gold); padding: 20px; text-align: center; background: #1a1a1a; border-radius: 15px; }
        .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .cart-icon { position: fixed; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: var(--gold); }
        .social-icons a { font-size: 30px; color: var(--gold); margin: 0 15px; text-decoration: none; }
    </style>
</head>
<body>

<!-- أيقونة السلة -->
<div class="cart-icon" onclick="showCart()"><i class="fas fa-shopping-basket"></i></div>

<div class="hero">
    <img src="logo.png" class="logo-img" alt="W Sweet">
    <h1>W Sweet</h1>
    <p>شهادات معتمدة في فنون الطهي والطباعة على الشوكولاتة</p>
</div>

<div class="grid" id="product-list"></div>

<div class="social-icons" style="text-align: center; padding: 40px;">
    <a href="https://wa.me/966..." target="_blank"><i class="fab fa-whatsapp"></i></a>
    <a href="https://instagram.com/..." target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://tiktok.com/..." target="_blank"><i class="fab fa-tiktok"></i></a>
</div>

<script>
    // --- لوحة تحكمك البسيطة ---
    const products = [
        {name: "شرايط للصواني", price: 10, img: "img1.jpg"},
        {name: "شوكولاتة بلجيكي", price: 150, img: "img2.jpg"},
        // أضف بقية المنتجات هنا بنفس الطريقة
    ];

    function renderProducts() {
        const container = document.getElementById('product-list');
        products.forEach(p => {
            container.innerHTML += `
                <div class="card">
                    <img src="${p.img}" style="width:100%; height:150px; object-fit:cover;">
                    <h3>${p.name}</h3>
                    <p>${p.price} ريال</p>
                    <button class="btn" onclick="addToCart('${p.name}', ${p.price})">إضافة للسلة</button>
                </div>`;
        });
    }
    
    // أضف منطق السلة هنا...
    renderProducts();
</script>
</body>
</html>
