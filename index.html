<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>W Sweet | المتجر الفاخر</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a1a; color: #d4af37; margin: 0; }
        .banner { background: #8b5a2b; color: #fff; text-align: center; padding: 15px; font-weight: bold; }
        header { text-align: center; padding: 40px; }
        .about { text-align: center; padding: 20px; background: rgba(139, 90, 43, 0.1); border: 1px solid #8b5a2b; margin: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #222; border: 1px solid #8b5a2b; padding: 20px; text-align: center; border-radius: 15px; }
        select, button { padding: 10px; margin-top: 10px; cursor: pointer; }
        .order-btn { background: #8b5a2b; color: #fff; border: none; width: 100%; border-radius: 5px; }
        .floating-order { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 15px 30px; border-radius: 50px; font-size: 20px; cursor: pointer; border: none; }
        .social { text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="banner">تنبيه: للطلبات الخاصة بالمناسبات، يرجى تقديم الطلب قبل الموعد بأسبوع على الأقل.</div>
    <header>
        <h1>W Sweet</h1>
        <p>شهادات معتمدة في فنون الطهي والطباعة على الشوكولاتة</p>
    </header>
    <div class="about">نتميز بأعلى معايير الجودة والاحترافية في صناعة وتزيين الشوكولاتة.</div>
    <div class="grid" id="menu"></div>
    <div class="social">
        <h3>تواصل معنا</h3>
        <a href="#">واتساب</a> | <a href="#">انستقرام</a> | <a href="#">تيك توك</a>
    </div>
    <button class="floating-order" onclick="sendOrder()">إتمام الطلب عبر الواتساب</button>

    <script>
        const products = [
            {id: 1, name: "شرايط للصواني", price: 10},
            {id: 2, name: "شرايط للمشروبات", price: 40},
            {id: 3, name: "شوكولاتة بلجيكي (كيلو)", price: 150},
            {id: 4, name: "توزيعات مواليد", price: 4},
            {id: 5, name: "شوكولاتة بار", options: {"صغير": 10, "وسط": 15, "كبير": 20}},
            {id: 6, name: "شوكولاتة نص كورة", price: 255},
            {id: 7, name: "لوقو دائري", options: {"10-9": 15, "13-15": 20}},
            {id: 8, name: "شوكولاتة تابلت", price: 50},
            {id: 9, name: "بسكوت الكابتشينو", price: 4},
            {id: 10, name: "صواني المناسبات", price: 100},
            {id: 11, name: "الطباعة على الشوكولاتة", price: 30}
        ];

        let cart = [];
        const menu = document.getElementById('menu');

        products.forEach(p => {
            let optionsHtml = p.options ? `<select id="opt-${p.id}">${Object.keys(p.options).map(o => `<option value="${o}">${o} - ${p.options[o]} ريال</option>`).join('')}</select>` : "";
            menu.innerHTML += `
                <div class="card">
                    <h3>${p.name}</h3>
                    ${optionsHtml}
                    <button class="order-btn" onclick="addToCart('${p.name}', ${p.price || 0}, 'opt-${p.id}')">إضافة للسلة</button>
                </div>`;
        });

        function addToCart(name, price, optId) {
            let select = document.getElementById(optId);
            let finalPrice = select ? products.find(p=>p.name==name).options[select.value] : price;
            let finalName = select ? name + " (" + select.value + ")" : name;
            cart.push({name: finalName, price: finalPrice});
            alert("تمت الإضافة");
        }

        function sendOrder() {
            let msg = "أرغب بطلب: %0A" + cart.map(i => i.name + ": " + i.price + " ريال").join("%0A");
            msg += "%0A%0Aالإجمالي: " + cart.reduce((a, b) => a + b.price, 0) + " ريال%0Aطريقة الدفع: تحويل بنكي.";
            window.open("https://wa.me/966XXXXXXXXXX?text=" + msg);
        }
    </script>
</body>
</html>
